<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สต๊อคออนไลน์ พี.เอส ออโต้ไทร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Bai+Jamjuree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9fafc; --card:#ffffff; --text:#1a2032; --text-sub:#5c6478;
    --accent:#2563eb; --accent-soft:#eaf1ff; --dark:#1a2032;
    --success:#16a34a; --warn:#d97706; --danger:#dc2626; --border:#e7e9f0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Anuphan',sans-serif; background:var(--bg); color:var(--text);}
  h1,h2,h3,.display{font-family:'Bai Jamjuree',sans-serif; font-weight:700;}
  button{font-family:inherit; cursor:pointer;}

  /* ---------- layout ---------- */
  .app{display:flex; min-height:100vh;}

  .sidebar{
    width:230px; background:#fff; border-right:1px solid var(--border);
    flex-shrink:0; display:flex; flex-direction:column; position:fixed; top:0; left:0;
    bottom:0; z-index:40; transition:transform .2s ease;
  }
  .sidebar .brand{
    padding:22px 20px; border-bottom:1px solid var(--border);
  }
  .sidebar .brand .name{font-size:15px; font-weight:700;}
  .sidebar .brand .branch-tag{
    display:inline-block; margin-top:6px; font-size:12px; color:var(--accent);
    background:var(--accent-soft); padding:3px 10px; border-radius:999px;
  }
  .nav{padding:14px 12px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
    color:var(--text-sub); font-size:14px; font-weight:500; margin-bottom:4px;
    background:none; border:none; width:100%; text-align:left;
    justify-content:flex-start;
  }
  .nav-item .ic{font-size:17px;}
  .nav-item:hover{background:#f2f4f9;}
  .nav-item.active{background:var(--accent-soft); color:var(--accent);}
  .sidebar-foot{padding:16px 20px; font-size:11px; color:var(--text-sub); border-top:1px solid var(--border);}

  .main{flex:1; margin-left:230px; min-width:0;}

  .topbar{
    height:60px; background:#fff; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:0 24px;
    position:sticky; top:0; z-index:30;
  }
  .topbar h2{font-size:17px;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .badge{
    background:var(--danger); color:#fff; font-size:11px; font-weight:600;
    padding:3px 9px; border-radius:999px;
  }
  .badge.zero{background:#e7e9f0; color:var(--text-sub);}
  .sync-status{font-size:12px; color:var(--text-sub); display:flex; align-items:center; gap:5px;}
  .sync-status .dot{width:7px; height:7px; border-radius:50%; background:#c7cce0;}
  .sync-status.online .dot{background:var(--success);}
  .sync-status.offline .dot{background:var(--danger);}
  .sync-status.syncing .dot{background:var(--warn);}
  .hamburger{display:none; background:none; border:none; font-size:22px; color:var(--text);}

  .content{padding:28px 24px; max-width:1080px;}

  .card{
    background:var(--card); border-radius:14px; padding:28px;
    box-shadow:0 4px 16px rgba(20,25,50,.06); border:1px solid var(--border);
  }
  .placeholder{
    text-align:center; padding:60px 20px; color:var(--text-sub);
  }
  .placeholder .ic{font-size:38px; margin-bottom:14px;}
  .placeholder h3{color:var(--text); font-size:16px; margin-bottom:6px;}
  .placeholder p{font-size:13px;}

  /* ---------- toolbar / forms / table (shared by data pages) ---------- */
  .toolbar{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  .toolbar-left{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .toolbar-right{display:flex; gap:10px; flex-wrap:wrap;}
  label.field-label{font-size:12px; color:var(--text-sub); font-weight:600; display:block; margin-bottom:5px;}
  .select-input, .text-input{
    font-family:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--border);
    border-radius:9px; background:#fff; color:var(--text); width:100%;
  }
  .select-input:focus, .text-input:focus{outline:none; border-color:var(--accent);}
  .btn-primary{
    background:var(--dark); color:#fff; border:none; padding:10px 18px; border-radius:9px;
    font-size:14px; font-weight:600; transition:background .15s;
  }
  .btn-primary:hover{background:var(--accent);}
  .btn-secondary{
    background:#fff; color:var(--text); border:1px solid var(--border); padding:10px 18px;
    border-radius:9px; font-size:14px; font-weight:600;
  }
  .btn-secondary:hover{border-color:var(--accent); color:var(--accent);}
  .btn-danger-text{background:none; border:none; color:var(--danger); font-size:13px; font-weight:600;}
  .btn-link-text{background:none; border:none; color:var(--accent); font-size:13px; font-weight:600;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-top:6px;}
  .form-actions{display:flex; gap:10px; margin-top:20px;}
  table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
  table.data-table th{
    text-align:left; padding:12px 16px; background:#f5f6fa; color:var(--text-sub);
    font-weight:600; font-size:12px; border-bottom:1px solid var(--border);
  }
  table.data-table td{padding:12px 16px; border-bottom:1px solid var(--border); text-align:left;}
  table.data-table tr:last-child td{border-bottom:none;}
  table.data-table .num{font-family:'Bai Jamjuree',sans-serif; text-align:right;}
  table.data-table th.num{text-align:right;}
  .qty-low{color:var(--danger); font-weight:700;}
  .cat-chip{
    display:inline-block; background:var(--accent-soft); color:var(--accent); font-size:11px;
    padding:3px 10px; border-radius:999px; font-weight:600;
  }
  .empty-row{text-align:center; color:var(--text-sub); padding:40px 20px !important;}
  .seg-toggle{display:inline-flex; background:#f2f4f9; border-radius:10px; padding:4px; gap:4px;}
  .seg-btn{
    background:none; border:none; padding:9px 18px; border-radius:8px; font-size:13px;
    font-weight:600; color:var(--text-sub);
  }
  .seg-btn.active{background:#fff; color:var(--text); box-shadow:0 2px 6px rgba(20,25,50,.08);}

  .summary-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px;}
  .summary-card{
    background:var(--card); border-radius:14px; padding:22px; border:1px solid var(--border);
    box-shadow:0 4px 16px rgba(20,25,50,.06);
  }
  .summary-card .label{font-size:12px; color:var(--text-sub); font-weight:600; margin-bottom:8px;}
  .summary-card .value{font-family:'Bai Jamjuree',sans-serif; font-weight:700; font-size:24px;}
  .summary-card .value.success{color:var(--success);}
  .summary-card .value.accent{color:var(--accent);}

  .cat-stock-row{
    display:flex; justify-content:space-between; align-items:center; padding:12px 0;
    border-bottom:1px solid var(--border); font-size:14px;
  }
  .cat-stock-row:last-child{border-bottom:none;}
  .cat-stock-row .qty{font-family:'Bai Jamjuree',sans-serif; font-weight:700;}

  .type-chip{font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;}
  .type-chip.sale{background:#e7f8ee; color:var(--success);}
  .type-chip.restock{background:var(--accent-soft); color:var(--accent);}

  /* ---------- branch setup modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,25,50,.55); display:flex;
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:#fff; border-radius:16px; padding:36px 32px; max-width:420px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
  }
  .modal h2{font-size:19px; margin-bottom:6px;}
  .modal p.sub{color:var(--text-sub); font-size:13px; margin-bottom:22px;}
  .branch-option{
    display:flex; align-items:center; gap:12px; padding:16px; border:2px solid var(--border);
    border-radius:12px; margin-bottom:12px; background:none; width:100%; text-align:right;
    font-size:15px; font-weight:600; color:var(--text); transition:border-color .15s;
  }
  .branch-option:hover{border-color:var(--accent);}
  .branch-option .ic{font-size:22px;}

  /* ---------- mobile ---------- */
  .scrim{display:none; position:fixed; inset:0; background:rgba(20,25,50,.4); z-index:35;}
  @media (max-width:860px){
    .sidebar{transform:translateX(-230px);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .hamburger{display:block;}
    .scrim.show{display:block;}
    .content{padding:20px 16px;}
  }
</style>
</head>
<body>

<div class="app">

  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="name">🔧 พี.เอส ออโต้ไทร์</div>
      <span class="branch-tag" id="branchTag">ยังไม่เลือกสาขา</span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-page="sale"><span class="ic">🧾</span><span>ขายสินค้า / ตัดสต๊อก</span></button>
      <button class="nav-item" data-page="restock"><span class="ic">📥</span><span>รับของเข้า / เพิ่มสต๊อก</span></button>
      <button class="nav-item" data-page="products"><span class="ic">📋</span><span>รายการสินค้า</span></button>
      <button class="nav-item" data-page="reports"><span class="ic">📊</span><span>รายงาน</span></button>
    </nav>
    <div class="sidebar-foot">เก็บข้อมูลในเครื่องนี้เท่านั้น</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="hamburger" id="hamburger">☰</button>
        <h2 id="pageTitle">ขายสินค้า / ตัดสต๊อก</h2>
      </div>
      <div class="topbar-right">
        <span class="sync-status" id="syncStatus"></span>
        <span class="badge zero" id="lowStockBadge">0 สต๊อกต่ำ</span>
      </div>
    </div>
    <div class="content" id="content">
      <!-- filled by JS per page -->
    </div>
  </div>

</div>

<!-- branch setup modal -->
<div class="overlay" id="branchOverlay" style="display:none;">
  <div class="modal">
    <h2>เครื่องนี้คือสาขาไหน?</h2>
    <p class="sub">เลือกครั้งเดียว ระบบจะจำไว้และแท็กทุกรายการที่บันทึกจากเครื่องนี้</p>
    <button class="branch-option" data-branch="phrabat"><span class="ic">🏬</span><span>สาขาพระบาท</span></button>
    <button class="branch-option" data-branch="lotus_pongsanuk"><span class="ic">🏬</span><span>สาขาโลตัสปงสนุก</span></button>
  </div>
</div>

<script>
  // วางค่าจาก Supabase ตรงนี้หลังสร้างโปรเจกต์เสร็จ (Project URL และ anon public key)
  // ถ้าปล่อยว่างไว้ แอพจะทำงานแบบเก็บข้อมูลในเครื่องอย่างเดียวเหมือนเดิม ไม่พังอะไร
  const SUPABASE_URL = "https://ofjsvfnthrokggugynjn.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_e_pe4MUnEXPe_HYPf2Z6JQ_HWu46406";

  const STORAGE_KEY = "psautotyre_stock";
  const BRANCH_NAMES = { phrabat: "สาขาพระบาท", lotus_pongsanuk: "สาขาโลตัสปงสนุก" };
  const PAGE_TITLES = {
    sale: "ขายสินค้า / ตัดสต๊อก",
    restock: "รับของเข้า / เพิ่มสต๊อก",
    products: "รายการสินค้า",
    reports: "รายงาน"
  };
  const CATEGORIES = [
    "ยาง", "น้ำมันเครื่อง", "น้ำมันเบรก", "ผ้าเบรก",
    "ไส้กรองน้ำมันเครื่อง", "กรองอากาศ", "กรองแอร์",
    "น้ำยาล้างเบรก", "น้ำยาล้างเครื่องยนต์ (Engine Flush)",
    "อะไหล่ฟุ่มเฟือย", "อะไหล่ทั่วไป"
  ];
  const LOW_STOCK_THRESHOLD = 3;
  // หมวดที่ต้องใช้ "รหัสสินค้า" (พาร์ทนัมเบอร์กรอง) เพราะระบุด้วยรุ่นรถ ไม่ใช่ชื่อรุ่นสินค้าแบบน้ำมัน/ยาง
  const CODE_CATEGORIES = ["ไส้กรองน้ำมันเครื่อง", "กรองอากาศ", "กรองแอร์"];

  function genId(){
    return "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
  }

  function downloadCsv(filename, rows){
    const csv = "﻿" + rows.map(r => r.map(cell => {
      const s = String(cell ?? "");
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function loadData(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      const initial = { branch: null, products: [], transactions: [] };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
      return initial;
    }
    return JSON.parse(raw);
  }
  function saveData(data){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    syncToServer(data);
  }

  function supabaseConfigured(){
    return !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  }
  function supabaseHeaders(withContentType){
    const h = { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` };
    if(withContentType) h["Content-Type"] = "application/json";
    return h;
  }

  function updateSyncStatus(mode){
    const el = document.getElementById("syncStatus");
    if(!supabaseConfigured()){ el.textContent = ""; el.className = "sync-status"; return; }
    const labels = { syncing: "กำลังซิงก์...", online: "ออนไลน์ • ซิงก์แล้ว", offline: "ออฟไลน์ • ยังไม่ได้ซิงก์" };
    el.textContent = labels[mode] ? `● ${labels[mode]}` : "";
    el.className = "sync-status " + mode;
  }

  // อัปเดต/เพิ่มแถวของสาขานี้ขึ้นเซิร์ฟเวอร์เท่านั้น (upsert) — ไม่ลบข้อมูลเดิมโดยอัตโนมัติเด็ดขาด
  // การลบทำเฉพาะตอนผู้ใช้กดลบสินค้าจริงๆ ผ่าน deleteProductRemote() เท่านั้น
  async function syncToServer(data){
    if(!supabaseConfigured() || !data.branch) return;
    updateSyncStatus("syncing");
    try{
      const productsWithBranch = data.products.map(p => ({ ...p, branch: data.branch }));
      const transactionsWithBranch = data.transactions.map(t => ({ ...t, branch: data.branch }));
      let ok = true;

      if(productsWithBranch.length > 0){
        const r = await fetch(`${SUPABASE_URL}/rest/v1/products?on_conflict=id`, {
          method: "POST",
          headers: { ...supabaseHeaders(true), "Prefer": "resolution=merge-duplicates" },
          body: JSON.stringify(productsWithBranch)
        });
        ok = ok && r.ok;
      }
      if(transactionsWithBranch.length > 0){
        const r = await fetch(`${SUPABASE_URL}/rest/v1/transactions?on_conflict=id`, {
          method: "POST",
          headers: { ...supabaseHeaders(true), "Prefer": "resolution=merge-duplicates" },
          body: JSON.stringify(transactionsWithBranch)
        });
        ok = ok && r.ok;
      }
      updateSyncStatus(ok ? "online" : "offline");
    }catch(err){
      updateSyncStatus("offline");
    }
  }

  // ลบสินค้ารายการเดียวออกจากเซิร์ฟเวอร์ — เรียกเฉพาะตอนผู้ใช้กดปุ่ม "ลบ" สินค้าจริงๆ เท่านั้น
  async function deleteProductRemote(productId){
    if(!supabaseConfigured()) return;
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(productId)}`, { method: "DELETE", headers: supabaseHeaders() });
    }catch(err){ /* เงียบไว้ — ครั้งถัดไปที่ syncFromServer จะยังเห็นรายการนี้ ลบซ้ำได้ */ }
  }

  async function syncFromServer(){
    if(!supabaseConfigured() || !state.branch) return;
    updateSyncStatus("syncing");
    try{
      const branchFilter = `branch=eq.${encodeURIComponent(state.branch)}&select=*`;
      const [pRes, tRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/products?${branchFilter}`, { headers: supabaseHeaders() }),
        fetch(`${SUPABASE_URL}/rest/v1/transactions?${branchFilter}`, { headers: supabaseHeaders() })
      ]);
      if(!pRes.ok || !tRes.ok) throw new Error("sync failed");
      const products = await pRes.json();
      const transactions = await tRes.json();
      state.products = products.map(p => ({ ...p, costPrice: Number(p.costPrice), sellPrice: Number(p.sellPrice), qty: Number(p.qty) }));
      state.transactions = transactions.map(t => ({ ...t, qty: Number(t.qty), unitPrice: Number(t.unitPrice), total: Number(t.total) }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateSyncStatus("online");
      if(["sale","restock","products","reports"].includes(currentPage)) renderPage(currentPage);
      updateLowStockBadge();
    }catch(err){
      updateSyncStatus("offline");
    }
  }

  let state = loadData();
  let currentPage = "sale";

  function renderBranchTag(){
    const tag = document.getElementById("branchTag");
    tag.textContent = state.branch ? BRANCH_NAMES[state.branch] : "ยังไม่เลือกสาขา";
  }

  function checkBranchSetup(){
    const overlay = document.getElementById("branchOverlay");
    if(!state.branch){
      overlay.style.display = "flex";
    } else {
      overlay.style.display = "none";
    }
  }

  document.querySelectorAll(".branch-option").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.branch = btn.dataset.branch;
      saveData(state);
      renderBranchTag();
      checkBranchSetup();
      syncFromServer();
    });
  });

  function renderPage(page){
    currentPage = page;
    document.getElementById("pageTitle").textContent = PAGE_TITLES[page];
    document.querySelectorAll(".nav-item").forEach(b=>{
      b.classList.toggle("active", b.dataset.page === page);
    });

    if(page === "products"){
      renderProductsPage();
    } else if(page === "restock"){
      renderRestockPage();
    } else if(page === "sale"){
      renderSalePage();
    } else if(page === "reports"){
      renderReportsPage();
    }

    // close mobile sidebar after nav
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("scrim").classList.remove("show");
  }

  /* ================= ตัวกรองหมวด/ยี่ห้อ/รุ่น (ใช้ร่วมกันหลายหน้า) ================= */
  function distinctSorted(arr){
    return [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b, "th"));
  }
  function getDistinctBrands(products, category){
    const list = (!category || category === "all") ? products : products.filter(p => p.category === category);
    return distinctSorted(list.map(p => p.brand));
  }
  function getDistinctModels(products, category, brand){
    let list = products;
    if(category && category !== "all") list = list.filter(p => p.category === category);
    if(brand && brand !== "all") list = list.filter(p => p.brand === brand);
    return distinctSorted(list.map(p => p.model));
  }
  function getDistinctSizes(products, category, brand, model){
    let list = products;
    if(category && category !== "all") list = list.filter(p => p.category === category);
    if(brand && brand !== "all") list = list.filter(p => p.brand === brand);
    if(model && model !== "all") list = list.filter(p => p.model === model);
    return distinctSorted(list.map(p => p.size));
  }
  function filterSelectHTML(id, label, options, selected){
    return `
      <div>
        <label class="field-label">${label}</label>
        <select class="select-input" id="${id}" style="width:auto;">
          <option value="all">ทั้งหมด</option>
          ${options.map(o => `<option value="${o}" ${o === selected ? "selected" : ""}>${o}</option>`).join("")}
        </select>
      </div>
    `;
  }
  function applyCategoryBrandModelFilter(products, filters){
    let list = products;
    if(filters.category && filters.category !== "all") list = list.filter(p => p.category === filters.category);
    if(filters.brand && filters.brand !== "all") list = list.filter(p => p.brand === filters.brand);
    if(filters.model && filters.model !== "all") list = list.filter(p => p.model === filters.model);
    if(filters.size && filters.size !== "all") list = list.filter(p => p.size === filters.size);
    return list;
  }

  // ย่อรูปให้ไม่ใหญ่เกินไปก่อนอัปโหลด (ประหยัดเน็ต/พื้นที่เก็บ)
  function resizeImageFile(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      const reader = new FileReader();
      reader.onload = ()=>{ img.src = reader.result; };
      reader.onerror = reject;
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("resize failed")), "image/jpeg", quality);
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadProductImage(productId, file){
    const blob = await resizeImageFile(file, 800, 0.75);
    const path = `${productId}_${Date.now()}.jpg`;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${IMAGE_BUCKET}/${path}`, {
      method: "POST",
      headers: { ...supabaseHeaders(), "Content-Type": "image/jpeg" },
      body: blob
    });
    if(!res.ok) throw new Error("upload failed: " + (await res.text()));
    return `${SUPABASE_URL}/storage/v1/object/public/${IMAGE_BUCKET}/${path}`;
  }

  async function saveProductForm(){
    const brand = document.getElementById("f_brand").value.trim();
    const model = document.getElementById("f_model").value.trim();
    const size = document.getElementById("f_size").value.trim();
    const code = document.getElementById("f_code").value.trim();
    const barcode = document.getElementById("f_barcode").value.trim();
    const category = document.getElementById("f_category").value;
    const costPrice = parseFloat(document.getElementById("f_cost").value);
    const sellPrice = parseFloat(document.getElementById("f_sell").value);
    const qty = parseInt(document.getElementById("f_qty").value, 10);

    if(!brand || !model){
      alert("กรุณากรอกยี่ห้อและรุ่นของสินค้า");
      return;
    }
    if(isNaN(costPrice) || costPrice < 0 || isNaN(sellPrice) || sellPrice < 0){
      alert("กรุณากรอกราคาซื้อและราคาขายเป็นตัวเลขไม่ติดลบ");
      return;
    }
    if(isNaN(qty) || qty < 0){
      alert("กรุณากรอกจำนวนคงเหลือเป็นตัวเลขไม่ติดลบ");
      return;
    }
    if(barcode && state.products.some(p => p.barcode === barcode && p.id !== editingProductId)){
      alert("เลขบาร์โค้ดนี้มีสินค้าอื่นใช้อยู่แล้ว");
      return;
    }

    const productId = editingProductId || genId();
    const existing = editingProductId ? state.products.find(x => x.id === editingProductId) : null;
    let imageUrl = existing ? (existing.imageUrl || "") : "";
    if(pendingImageRemoved) imageUrl = "";

    if(pendingImageFile){
      const saveBtn = document.getElementById("saveProductBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "กำลังอัปโหลดรูป...";
      try{
        imageUrl = await uploadProductImage(productId, pendingImageFile);
      }catch(err){
        alert("อัปโหลดรูปไม่สำเร็จ (เช็คอินเทอร์เน็ต) — บันทึกข้อมูลส่วนอื่นให้แล้ว รูปลองอัปโหลดใหม่ทีหลังได้");
      }
      saveBtn.disabled = false;
      saveBtn.textContent = "บันทึก";
    }

    if(existing){
      Object.assign(existing, { category, brand, model, size, code, barcode, costPrice, sellPrice, qty, imageUrl });
    } else {
      state.products.push({ id: productId, category, brand, model, size, code, barcode, costPrice, sellPrice, qty, imageUrl });
    }
    saveData(state);
    closeProductForm();
    renderProductTable();
    updateLowStockBadge();
  }

  function saveRestock(){
    const qty = parseInt(document.getElementById("r_qty").value, 10);
    const unitCost = parseFloat(document.getElementById("r_cost").value);
    const staff = document.getElementById("r_staff").value.trim();

    if(isNaN(qty) || qty <= 0){
      alert("กรุณากรอกจำนวนรับเข้าเป็นตัวเลขมากกว่า 0");
      return;
    }
    if(isNaN(unitCost) || unitCost < 0){
      alert("กรุณากรอกต้นทุนต่อหน่วยเป็นตัวเลขไม่ติดลบ");
      return;
    }
    if(!staff){
      alert("กรุณากรอกชื่อผู้บันทึก");
      return;
    }

    let product;

    if(restockMode === "existing"){
      const productId = document.getElementById("r_product").value;
      product = state.products.find(p => p.id === productId);
      if(!product){
        alert("กรุณาเลือกสินค้า");
        return;
      }
      product.qty += qty;
    } else {
      const category = document.getElementById("r_category").value;
      const brand = document.getElementById("r_brand").value.trim();
      const model = document.getElementById("r_model").value.trim();
      const size = document.getElementById("r_size").value.trim();
      const code = CODE_CATEGORIES.includes(category) ? document.getElementById("r_code").value.trim() : "";
      const barcode = document.getElementById("r_new_barcode").value.trim();
      const sellPrice = parseFloat(document.getElementById("r_sell").value);
      if(!brand || !model){
        alert("กรุณากรอกยี่ห้อและรุ่นของสินค้าใหม่");
        return;
      }
      if(isNaN(sellPrice) || sellPrice < 0){
        alert("กรุณากรอกราคาขายเป็นตัวเลขไม่ติดลบ");
        return;
      }
      if(barcode && state.products.some(p => p.barcode === barcode)){
        alert("เลขบาร์โค้ดนี้มีสินค้าอื่นใช้อยู่แล้ว");
        return;
      }
      product = { id: genId(), category, brand, model, size, code, barcode, costPrice: unitCost, sellPrice, qty: qty };
      state.products.push(product);
    }

    state.transactions.push({
      id: genId(),
      type: "restock",
      datetime: new Date().toISOString(),
      productId: product.id,
      productName: `${product.brand} ${product.model} ${product.size}`,
      qty: qty,
      unitPrice: unitCost,
      total: qty * unitCost,
      staff: staff
    });

    localStorage.setItem("psautotyre_last_staff", staff);
    saveData(state);

    document.getElementById("r_qty").value = "";
    document.getElementById("r_cost").value = "";
    if(restockMode === "new"){
      restockMode = "existing";
      renderRestockPage();
    } else {
      renderRestockFields();
      renderRestockHistory();
    }
    updateLowStockBadge();
    document.getElementById("r_barcode").focus();
  }

  function renderSaleFilters(){
    const box = document.getElementById("saleFilters");
    const brands = getDistinctBrands(state.products, saleCategoryFilter);
    const models = getDistinctModels(state.products, saleCategoryFilter, saleBrandFilter);
    const sizes = getDistinctSizes(state.products, saleCategoryFilter, saleBrandFilter, saleModelFilter);
    box.innerHTML =
      filterSelectHTML("saleCategoryFilter", "กรองตามหมวด", CATEGORIES, saleCategoryFilter) +
      filterSelectHTML("saleBrandFilter", "กรองตามยี่ห้อ", brands, saleBrandFilter) +
      filterSelectHTML("saleModelFilter", "กรองตามรุ่น", models, saleModelFilter) +
      filterSelectHTML("saleSizeFilter", "กรองตามขนาด", sizes, saleSizeFilter);

    document.getElementById("saleCategoryFilter").addEventListener("change", (e)=>{
      saleCategoryFilter = e.target.value;
      saleBrandFilter = "all";
      saleModelFilter = "all";
      saleSizeFilter = "all";

      renderSaleProductOptions();
    });

      saleModelFilter = "all";

      renderSaleProductOptions();

  function handleBarcodeScan(code){
    if(!code) return;
    const product = state.products.find(p => p.barcode && p.barcode === code);
    if(!product){
      alert(`ไม่พบสินค้าที่บาร์โค้ด "${code}"`);
      return;
    }
    const alreadySelected = document.getElementById("s_product")?.value === product.id;
    const prevQty = alreadySelected ? (parseInt(document.getElementById("s_qty").value, 10) || 0) : 0;
    const nextQty = prevQty + 1;

    saleSearchText = "";
    saleCategoryFilter = "all";
    saleBrandFilter = "all";
    saleModelFilter = "all";
    saleSizeFilter = "all";
    document.getElementById("s_search").value = "";
    renderSaleFilters();
    renderSaleProductOptions();
    document.getElementById("s_product").value = product.id;

    if(nextQty > product.qty){
      alert(`ของไม่พอขาย — "${product.brand} ${product.model}" เหลือในสต๊อกแค่ ${product.qty} ชิ้น`);
      document.getElementById("s_qty").value = product.qty;
    } else {
      document.getElementById("s_qty").value = nextQty;
    }
    updateSaleTotal();
    document.getElementById("s_barcode").focus();
  }

  function getSaleFilteredProducts(){
    let list = applyCategoryBrandModelFilter(state.products, {
      category: saleCategoryFilter, brand: saleBrandFilter, model: saleModelFilter, size: saleSizeFilter
    });
    const q = saleSearchText.trim().toLowerCase();
    if(q){
      list = list.filter(p => (p.category + p.brand + p.model + p.size + (p.code || "")).toLowerCase().includes(q));
    }
    return list;
  }

  function renderSaleProductOptions(){
    const select = document.getElementById("s_product");
    const items = getSaleFilteredProducts();
    if(items.length === 0){
      select.innerHTML = `<option value="">ไม่พบสินค้า</option>`;
    } else {
      select.innerHTML = items.map(p => `<option value="${p.id}">${productLabel(p)}</option>`).join("");
    }
    select.onchange = updateSaleTotal;
    updateSaleTotal();
  }

  function updateSaleTotal(){
    const select = document.getElementById("s_product");
    const qtyInput = document.getElementById("s_qty");
    const product = state.products.find(p => p.id === select.value);
    const qty = parseInt(qtyInput.value, 10);
    const total = product && !isNaN(qty) && qty > 0 ? product.sellPrice * qty : 0;
    document.getElementById("s_total").textContent = total.toLocaleString("th-TH", {minimumFractionDigits:2}) + " ฿";
  }

      return;

  function saveSale(){
    const productId = document.getElementById("s_product").value;
    const qty = parseInt(document.getElementById("s_qty").value, 10);
    const staff = document.getElementById("s_staff").value.trim();

    const product = state.products.find(p => p.id === productId);
    if(!product){
      alert("กรุณาเลือกสินค้า");
      return;
    }
    if(isNaN(qty) || qty <= 0){
      alert("กรุณากรอกจำนวนขายเป็นตัวเลขมากกว่า 0");
      return;
    }
    if(!staff){
      alert("กรุณากรอกชื่อผู้บันทึก");
      return;
    }
    if(qty > product.qty){
      alert(`ของไม่พอขาย — "${product.brand} ${product.model}" เหลือในสต๊อกแค่ ${product.qty} ชิ้น`);
      return;
    }

    product.qty -= qty;
    state.transactions.push({
      id: genId(),
      type: "sale",
      datetime: new Date().toISOString(),
      productId: product.id,
      productName: `${product.brand} ${product.model} ${product.size}`,
      qty: qty,
      unitPrice: product.sellPrice,
      total: qty * product.sellPrice,
      staff: staff
    });

    localStorage.setItem("psautotyre_last_staff", staff);
    saveData(state);

    document.getElementById("s_qty").value = "";
    renderSaleProductOptions();
    renderSaleHistory();
    updateLowStockBadge();
    document.getElementById("s_barcode").focus();
  }

  function updateLowStockBadge(){
    const badge = document.getElementById("lowStockBadge");
    const lowCount = state.products.filter(p => p.qty <= LOW_STOCK_THRESHOLD).length;
    badge.textContent = `${lowCount} สต๊อกต่ำ`;
    badge.classList.toggle("zero", lowCount === 0);
  }

  function renderReportData(){

    const restockTotal = restocks.reduce((sum, t) => sum + t.total, 0);

    document.getElementById("rep_salesTotal").textContent = salesTotal.toLocaleString("th-TH", {minimumFractionDigits:2}) + " ฿";
    document.getElementById("rep_restockTotal").textContent = restockTotal.toLocaleString("th-TH", {minimumFractionDigits:2}) + " ฿";

    document.getElementById("scrim").classList.add("show");

  document.getElementById("scrim").addEventListener("click", ()=>{
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("scrim").classList.remove("show");
  });

  // init
  renderBranchTag();
  checkBranchSetup();
  renderPage("sale");
  updateLowStockBadge();
  updateSyncStatus("");
  if(state.branch) syncFromServer();
</script>

</body>
</html>
